<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated terminal window showing KunalOS boot sequence, whoami command, and blinking cursor">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#27272a" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="0" y="0" width="800" height="540" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Window shadow and frame -->
  <rect x="0" y="0" width="800" height="540" rx="16" ry="16" fill="#09090b" filter="url(#shadow)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="50" rx="16" ry="16" fill="url(#headerGrad)"/>
  <rect x="0" y="38" width="800" height="12" fill="#18181b"/>

  <!-- Traffic lights -->
  <circle cx="28" cy="25" r="8" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="8" fill="#ffbd2e"/>
  <circle cx="76" cy="25" r="8" fill="#27c93f"/>

  <!-- Title -->
  <text x="400" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#a1a1aa" text-anchor="middle">kunal@github — zsh — 80x24</text>

  <!-- Content -->
  <g clip-path="url(#windowClip)">
    <!-- Subtle grid background -->
    <rect x="0" y="50" width="800" height="490" fill="#09090b"/>
    <rect x="0" y="50" width="800" height="490" fill="url(#dotGrid)"/>

    <!-- Boot sequence -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#71717a">
      <text x="28" y="110" opacity="0">
        <tspan fill="#22c55e">&gt;</tspan>
        <tspan dx="10">Booting KunalOS v1.0</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.4s" fill="freeze"/>
      </text>

      <text x="28" y="155" opacity="0">
        <tspan fill="#22c55e">✓</tspan>
        <tspan dx="10">Loading developer profile...</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.9s" fill="freeze"/>
      </text>

      <text x="28" y="200" opacity="0">
        <tspan fill="#22c55e">✓</tspan>
        <tspan dx="10">Initializing AI modules...</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.4s" fill="freeze"/>
      </text>

      <text x="28" y="245" opacity="0">
        <tspan fill="#22c55e">✓</tspan>
        <tspan dx="10">Connecting to GitHub...</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.9s" fill="freeze"/>
      </text>

      <text x="28" y="290" opacity="0">
        <tspan fill="#22c55e">✓</tspan>
        <tspan dx="10">Ready.</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.4s" fill="freeze"/>
      </text>
    </g>

    <!-- Prompt -->
    <g opacity="0">
      <text x="28" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#a1a1aa">kunal@github:~$</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.1s" fill="freeze"/>
    </g>

    <!-- Typed command: "whoami" -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#e4e4e7">
      <text x="196" y="360" opacity="0">w
        <animate attributeName="opacity" values="0;1" dur="0.05s" begin="3.4s" fill="freeze"/>
      </text>
      <text x="209" y="360" opacity="0">h
        <animate attributeName="opacity" values="0;1" dur="0.05s" begin="3.5s" fill="freeze"/>
      </text>
      <text x="222" y="360" opacity="0">o
        <animate attributeName="opacity" values="0;1" dur="0.05s" begin="3.6s" fill="freeze"/>
      </text>
      <text x="235" y="360" opacity="0">a
        <animate attributeName="opacity" values="0;1" dur="0.05s" begin="3.7s" fill="freeze"/>
      </text>
      <text x="248" y="360" opacity="0">m
        <animate attributeName="opacity" values="0;1" dur="0.05s" begin="3.8s" fill="freeze"/>
      </text>
      <text x="261" y="360" opacity="0">i
        <animate attributeName="opacity" values="0;1" dur="0.05s" begin="3.9s" fill="freeze"/>
      </text>
    </g>

    <!-- Output -->
    <g opacity="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="28" y="410" font-size="22" font-weight="600" fill="#fafafa">Kunal Ghadge</text>
      <text x="28" y="445" font-size="15" fill="#a1a1aa">AI &amp; ML Engineer</text>
      <text x="28" y="480" font-size="15" fill="#71717a">Building useful software and AI products</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.4s" fill="freeze"/>
    </g>

    <!-- Second prompt -->
    <g opacity="0">
      <text x="28" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#a1a1aa">kunal@github:~$</text>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="5.0s" fill="freeze"/>
    </g>

    <!-- Blinking cursor -->
    <rect x="196" y="514" width="10" height="22" rx="2" fill="#22c55e" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
